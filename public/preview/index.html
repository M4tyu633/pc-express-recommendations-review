<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>PC Express | Personalization preview</title>
    <link rel="stylesheet" href="/preview.css">
    <script type="module" src="/preview.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-main">
        <button class="brand" data-action="navigate" data-surface="home" disabled aria-label="PC Express home">
          <span class="brand-pc">PC</span><span>EXPRESS</span>
        </button>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="search-query">Search sample products</label>
          <input id="search-query" maxlength="80" placeholder="Search sample products" disabled>
          <button type="submit" disabled>Search</button>
        </form>
        <button class="cart-control" data-action="navigate" data-surface="cart" disabled>Cart <span id="cart-count">0</span></button>
      </div>
      <nav class="shell nav" aria-label="Storefront pages">
        <button data-action="navigate" data-surface="home" aria-current="page" disabled>Home</button>
        <button data-action="navigate" data-surface="product" disabled>Product</button>
        <button data-action="navigate" data-surface="search" disabled>Search results</button>
        <button data-action="navigate" data-surface="cart" disabled>Cart</button>
      </nav>
    </header>
    <main class="shell">
      <section class="hero" aria-labelledby="hero-heading">
        <div>
          <p class="preview-label">Storefront preview</p>
          <h1 id="hero-heading">Personalization</h1>
          <p>Browse the sample catalog and see how suggestions change across the store.</p>
        </div>
        <div class="session">
          <label><input type="checkbox" id="allow-personalization" disabled> Allow personalization</label>
          <button id="reset-session" type="button" disabled>Reset session</button>
        </div>
      </section>
      <p id="preview-status" role="status">Loading the sample catalog…</p>
      <div id="page-context"></div>
      <div id="placements"><!-- PREVIEW_FALLBACK --></div>
      <section class="sample-catalog" id="sample-catalog" aria-labelledby="catalog-heading">
        <h2 id="catalog-heading">Sample catalog</h2>
        <div class="product-grid" id="catalog-grid"></div>
      </section>
      <noscript><p>Enable JavaScript to browse the catalog and test personalization.</p></noscript>
    </main>
  </body>
</html>
